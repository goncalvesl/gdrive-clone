[workspace]
members = ["crates/sync-core", "crates/state-store", "crates/local-fs", "crates/drive-api", "crates/engine", "apps/drive-desktop"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
